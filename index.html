<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraPods</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --card: #101d33;
        --text: #f4f8ff;
        --muted: #9fb2d0;
        --accent: #8b5cf6;
        --accent-2: #22d3ee;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #16253d 60%, #0b1220);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 760px);
        background: rgba(16, 29, 51, 0.95);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 36px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.8rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .pill {
        padding: 10px 14px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: white;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>AuraPods</h1>
      <p>Welcome to AuraPods. This starter page is ready for your content, branding, and product details.</p>
      <div class="pill-row">
        <span class="pill">Modern</span>
        <span class="pill">Fast</span>
        <span class="pill">Ready to customize</span>
      </div>
    </main>
  </body>
</html>
